ss","addressLocality":"Cancún","addressRegion":"Quintana Roo","addressCountry":"MX"},"geo":{"@type":"GeoCoordinates","latitude":21.0365,"longitude":-86.8771}},{"@type":"FAQPage","@id":"https://jetcab.mx/#faq","inLanguage":"es-MX","isPartOf":{"@id":"https://jetcab.mx/#webpage"},"mainEntity":[{"@type":"Question","name":"¿Cuánto cuesta rentar un jet privado en México?","acceptedAnswer":{"@type":"Answer","text":"Rentar un jet privado con JETCAB desde Toluca (AIT) cuesta desde $1,800 USD por trayecto en un Learjet 35 para 7 pasajeros (CDMX–Guadalajara) y desde $3,200 USD a Cancún. Un Challenger 605 para 12 pasajeros parte de $3,800 USD; un Gulfstream de cabina grande, de cotizar. El precio es por aeronave, no por asiento, e incluye tripulación, combustible, catering y permisos."}},{"@type":"Question","name":"¿Cuánto cuesta un vuelo privado de la Ciudad de México a Cancún?","acceptedAnswer":{"@type":"Answer","text":"Un jet privado JETCAB de Toluca (AIT) a Cancún (CUN) cuesta desde $3,200 USD por trayecto en Learjet 35 (7 pasajeros), $6,500 USD en Challenger 605 (12) y $12,000 USD en Gulfstream (16). El vuelo dura 2 h 15 min sin escalas; la terminal privada de CUN está a 15 minutos de la Zona Hotelera. Cotización confirmada en 30 minutos."}},{"@type":"Question","name":"¿Cuánto cuesta un jet privado de CDMX a Los Cabos?","acceptedAnswer":{"@type":"Answer","text":"JETCAB vuela de Toluca (AIT) a Los Cabos (SJD) en 2 h 30 min. El trayecto parte de $3,800 USD en Learjet 35, cotizar en Challenger 605 y cotizar en Gulfstream, precio por aeronave. Vuelo nacional: sin migración ni aduana. Los resorts del Corredor están a 15–25 minutos de la terminal privada."}},{"@type":"Question","name":"¿Cuánto cuesta un jet privado de CDMX a Monterrey?","acceptedAnswer":{"@type":"Answer","text":"El vuelo JETCAB Toluca (AIT)–Monterrey (MTY) dura 1 h 15 min y cuesta desde $2,200 USD por trayecto en Learjet 35 (7 pasajeros), cotizar en Challenger 605 y cotizar en Gulfstream. Es la ruta de negocios más rápida de la flota: salida 7:00, en San Pedro Garza García a las 9:00 y de regreso en CDMX a las 18:30 el mismo día."}},{"@type":"Question","name":"¿Cuánto cuesta un jet privado de México a Miami?","acceptedAnswer":{"@type":"Answer","text":"JETCAB vuela de Toluca (AIT) a Miami Opa-locka (OPF) sin escalas en 3 h 30 min. bajo cotización por trayecto en Learjet 35 (7 pasajeros), cotizar en Challenger 605 (12) y cotizar en Gulfstream (16). Aduana de EE. UU. en la terminal privada en menos de 15 minutos; OPF está a 20 minutos de South Beach."}},{"@type":"Question","name":"¿Cuánto cuesta un jet privado por hora en México?","acceptedAnswer":{"@type":"Answer","text":"Tarifas de referencia JETCAB por hora de vuelo: Learjet 35 (jet ligero, 7 plazas) cotizar; Challenger 605 (mediano, 12 plazas) cotizar; Gulfstream (cabina grande, 16 plazas) cotizar; helicóptero Bell 206 (4 plazas) cotizar; helicóptero AW139 (8 plazas VIP) cotizar; ambulancia aérea UCI cotizar. Incluyen tripulación, combustible, catering y permisos."}},{"@type":"Question","name":"¿Desde qué aeropuerto salen los jets privados en la Ciudad de México?","acceptedAnswer":{"@type":"Answer","text":"JETCAB opera desde el Aeropuerto Internacional de Toluca (AIT / MMTO), a 65 km de la Ciudad de México y a 40–50 minutos de Santa Fe y Polanco, desde una terminal privada (FBO) sin tráfico comercial. Con el protocolo Tarmac-to-Cabin, el pasajero pasa de su camioneta a la escalinata del avión en menos de 10 minutos."}},{"@type":"Question","name":"¿En cuánto tiempo puede JETCAB tener un jet listo?","acceptedAnswer":{"@type":"Answer","text":"JETCAB confirma una cotización cerrada (aeronave, precio y ruta) en 30 minutos tras el mensaje de WhatsApp al +52 729 108 1200, las 24 horas. En vuelos nacionales la aeronave está lista para despegar de Toluca (AIT) en 2 horas desde la confirmación. Vuelos a EE. UU.: unas 24 horas por eAPIS y aduana; otros destinos internacionales: 48–72 horas por permisos de sobrevuelo."}},{"@type":"Question","name":"¿JETCAB es una empresa certificada para operar jets privados en México?","acceptedAnswer":{"@type":"Answer","text":"JETCAB opera jets privados y helicópteros desde el Aeropuerto Internacional de Toluca (AIT) desde 1999, 25 años, como permisionario de la Agencia Federal de Aviación Civil (AFAC, antes DGAC), con registro IS-BAO. Más de 2,000 vuelos realizados para más de 500 clientes en México, Estados Unidos, Latinoamérica y Europa."}},{"@type":"Question","name":"¿Qué documentos necesito para volar a Estados Unidos en jet privado desde México?","acceptedAnswer":{"@type":"Answer","text":"Pasaporte vigente y visa B1/B2 de Estados Unidos. La autorización ESTA no es válida en aviación privada, porque el programa de exención exige llegar en una aerolínea comercial firmante. JETCAB presenta el manifiesto eAPIS, coordina la revisión de aduana (CBP) en la terminal privada de llegada, en menos de 15 minutos, y gestiona los permisos de sobrevuelo."}},{"@type":"Question","name":"¿Qué incluye el precio de un jet privado con JETCAB?","acceptedAnswer":{"@type":"Answer","text":"Cada cotización JETCAB incluye aeronave y tripulación, combustible, tasas de aterrizaje y manejo en ambos aeropuertos, permisos mexicanos, catering a bordo, coordinación en tierra en Toluca (AIT) y concierge 24/7. Los vuelos internacionales suman permisos de sobrevuelo, eAPIS y coordinación aduanal. No incluye, salvo solicitud: transporte terrestre en destino, camioneta blindada y catering de chef."}},{"@type":"Question","name":"¿Qué es Identity Shield de JETCAB?","acceptedAnswer":{"@type":"Answer","text":"Identity Shield es el protocolo de confidencialidad de JETCAB: tripulación y personal de tierra firman un acuerdo de confidencialidad por cada vuelo, los nombres de los pasajeros aparecen solo en el manifiesto regulatorio, el abordaje ocurre en la terminal privada de Toluca (AIT) sin paso por terminal pública, y ninguna información de vuelo, invitados o carga se comparte con terceros. Incluido en todos los vuelos."}},{"@type":"Question","name":"¿Cuánto cuesta rentar un helicóptero en la Ciudad de México?","acceptedAnswer":{"@type":"Answer","text":"El Bell 206 de JETCAB (4 pasajeros) cuesta bajo cotización de vuelo y el AW139 (8 pasajeros VIP, bimotor) bajo cotización. Trayectos habituales: Toluca (AIT)–helipuertos de Santa Fe o Polanco en 12–15 minutos, CDMX–Valle de Bravo en 25 minutos, CDMX–Acapulco en 1 h 20 min aproximadamente."}},{"@type":"Question","name":"¿Cómo se paga un jet privado y aceptan criptomonedas?","acceptedAnswer":{"@type":"Answer","text":"JETCAB acepta transferencia en pesos o dólares, tarjeta de crédito y criptomonedas (Bitcoin y USDC), liquidadas antes del despegue. Para salidas el mismo día con importes altos ofrece liquidación por escrow y saldo prepagado tipo jet card, de modo que un límite bancario nunca retrase una salida. Se emite CFDI por cada vuelo."}},{"@type":"Question","name":"¿Hay vuelos vacíos (empty legs) más baratos con JETCAB?","acceptedAnswer":{"@type":"Answer","text":"Sí. Cuando una aeronave JETCAB se reposiciona sin pasajeros, ese tramo se ofrece como empty leg hasta 30 % por debajo de la tarifa normal. Se anuncian solo en la lista privada de WhatsApp de JETCAB, normalmente con 24–72 horas de antelación, en rutas como Toluca–Cancún, Toluca–Monterrey y Toluca–Miami. Fecha y hora son fijas; el precio es por aeronave completa."}}]}]}</script>
